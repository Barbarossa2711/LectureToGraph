services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # The browser talks to Neo4j over the published host port (neovis.js).
      NEO4J_BROWSER_URI: bolt://localhost:7687
      NEO4J_BROWSER_USER: neo4j
      NEO4J_BROWSER_PASSWORD: password
      WORKSPACE_DIR: /work
      # Provider API keys are read from your shell environment (or a .env file).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional private endpoint. Empty base URL -> provider stays hidden.
      CLUSTER_BASE_URL: ${CLUSTER_BASE_URL:-}
      CLUSTER_API_KEY: ${CLUSTER_API_KEY:-}
      CLUSTER_MODEL: ${CLUSTER_MODEL:-moonshotai/Kimi-K2.7}
      CLUSTER_CA_BUNDLE: ${CLUSTER_CA_BUNDLE:-}
      CLUSTER_VERIFY_SSL: ${CLUSTER_VERIFY_SSL:-true}
    volumes:
      - workspace_data:/work
      # Server certificate for a self-signed CLUSTER_BASE_URL. Put the .pem into
      # ./certs and point CLUSTER_CA_BUNDLE at /certs/<name>.pem
      - ./certs:/certs:ro
    # lets the container reach a Neo4j running on the host (host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  workspace_data:
